name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --console=plain 2>&1 | tee build.log
        shell: bash -o pipefail {0}
      - name: Save build log on failure
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong|Unresolved|Exception" -A4 build.log | head -300 > errors.txt || true
          mkdir /tmp/logs && cp errors.txt build.log /tmp/logs/
          cd /tmp/logs && git init -q -b build-log && git add . 
          git -c user.name=ci -c user.email=ci@local commit -qm "log ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-log
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Hearth.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Hearth.apk --title "Hearth (build ${{ github.run_number }})" --notes "Tap Hearth.apk below to download and install." --latest
